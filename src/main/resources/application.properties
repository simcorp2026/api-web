# Configuración de la conexión a PostgreSQL 
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pweb
# Hibernate valida el esquema; el esquema lo crean y cambian las migraciones de Flyway
quarkus.hibernate-orm.database.generation=validate
%dev.quarkus.hibernate-orm.log.sql=true
# Migraciones Flyway (src/main/resources/db/migration). Una base con tablas previas se marca como versión 1
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
# Logs en JSON solo en producción; en desarrollo se mantienen legibles
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
quarkus.http.root-path=/facturacion/v1.1
quarkus.http.port=8081
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:8080
# Documentación OpenAPI (Swagger UI disponible en /q/swagger-ui bajo la ruta base)
quarkus.smallrye-openapi.info-title=API de Facturación
quarkus.smallrye-openapi.info-version=1.1.0
quarkus.smallrye-openapi.info-description=Gestión de productos y ventas
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.security-scheme=jwt

# Seguridad JWT: claves RSA en certs/ (no versionar la privada); emisor y vida del token
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:certs/publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:api-web}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:certs/privateKey.pem}
smallrye.jwt.new-token.lifespan=3600
# Contraseña inicial del usuario admin (solo se usa si la tabla usuario está vacía)
app.admin.password=${ADMIN_PASSWORD}
%test.app.admin.password=test-admin-123